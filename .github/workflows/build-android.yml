name: Build Android Vulkan runtime (arm64)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'URL APK dari Releases (opsional, untuk menukar libvitart.so di dalamnya)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: android-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Compile runtime and loader shim
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_ZIP: android-ndk-r29-linux.zip
      OPT: -O2

    steps:
      - uses: actions/checkout@v4

      - name: Cache Android NDK r29
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/ndk
          key: android-ndk-r29-linux-v1

      - name: Download Android NDK r29
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/ndk"
          curl -fL --retry 3 -o "/tmp/$NDK_ZIP" "https://dl.google.com/android/repository/$NDK_ZIP"
          unzip -q "/tmp/$NDK_ZIP" -d "$HOME/ndk"
          test -d "$HOME/ndk/android-ndk-r29"

      - name: Configure NDK environment
        shell: bash
        run: |
          echo "ANDROID_NDK=$HOME/ndk/android-ndk-r29" >> "$GITHUB_ENV"
          echo "$HOME/ndk/android-ndk-r29" >> "$GITHUB_PATH"

      - name: Adapt runtime build script for Linux
        shell: bash
        run: sed -i 's#ndk-build\.cmd#ndk-build#g' scripts/build-android-runtime.sh

      - name: Build libvitart.so
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)" REFAZ=1 bash scripts/build-android-runtime.sh
          test -s build/lib/libvitart.so
          readelf -h build/lib/libvitart.so | grep -E 'Class:.*ELF64|Machine:.*AArch64'

      - name: Build Vulkan loader shim and driver hooks
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-android-vkshim.sh
          for lib in libvulkan.so libhook_impl.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so; do
            test -s "build/lib/$lib"
            readelf -h "build/lib/$lib" | grep -q 'Machine:.*AArch64'
          done

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gow-vulkan-android-arm64
          if-no-files-found: error
          path: |
            build/lib/libvitart.so
            build/lib/libvulkan.so
            build/lib/libhook_impl.so
            build/lib/libmain_hook.so
            build/lib/libfile_redirect_hook.so
            build/lib/libgsl_alloc_hook.so
            build/vkshim/nomes.txt

      # Opcional: menukar libvitart.so dentro de um APK que sudah ada
      - name: Repack APK dengan libvitart.so baru
        if: ${{ inputs.apk_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o orig.apk "${{ inputs.apk_url }}"
          rm -rf apkx && mkdir apkx && unzip -q orig.apk -d apkx
          ls apkx/lib/arm64-v8a/ | tee /tmp/libs.txt
          test -f apkx/lib/arm64-v8a/libvitart.so
          cp build/lib/libvitart.so apkx/lib/arm64-v8a/libvitart.so
          rm -rf apkx/META-INF
          (cd apkx && zip -qr -X ../unsigned.apk '[Content_Types].xml' . -x '[Content_Types].xml' 2>/dev/null || zip -qr -X ../unsigned.apk .)
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -f -P 16 4 unsigned.apk aligned.apk || "$BT/zipalign" -f -p 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore debug.jks -storepass android -keypass android \
            -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=texmod"
          "$BT/apksigner" sign --ks debug.jks --ks-pass pass:android --key-pass pass:android \
            --out gow-texmod.apk aligned.apk
          "$BT/apksigner" verify gow-texmod.apk

      - name: Publish repacked APK
        if: ${{ inputs.apk_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gow-texmod-apk
          if-no-files-found: error
          path: gow-texmod.apk
