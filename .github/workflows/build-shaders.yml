name: Build shader cache (usse_build_cache)

on:
  workflow_dispatch:
    inputs:
      miss_path:
        description: "Folder miss di repo, atau file .zip berisi folder miss (contoh: shader/miss atau miss.zip)"
        required: true
        default: "shader/miss"
      extra_args:
        description: "Argumen tambahan untuk alat. Kosong untuk Vulkan, isi --d3d11 untuk Direct3D 11"
        required: false
        default: ""
      tool_script:
        description: "Lokasi alat terjemahan di repo (kalau tidak ada, dicari otomatis)"
        required: true
        default: "tools/usse_build_cache.py"
      tools_zip:
        description: "Zip folder tools/ di repo (dibuka otomatis kalau ada)"
        required: false
        default: "tools.zip"
      vitarecomp_zip:
        description: "Zip folder vitarecomp/ di repo (dibuka otomatis kalau ada)"
        required: false
        default: "vitarecomp.zip"
      tool_repo:
        description: "Opsional: repo GitHub berisi alat (owner/nama), dipakai kalau repo-mu belum punya alatnya"
        required: false
        default: ""
      tool_ref:
        description: "Opsional: branch/tag repo alat (kosong = branch default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISS_PATH: ${{ inputs.miss_path }}
      EXTRA_ARGS: ${{ inputs.extra_args }}
      TOOL: ${{ inputs.tool_script }}
      TOOL_REPO: ${{ inputs.tool_repo }}
      TOOLS_ZIP: ${{ inputs.tools_zip }}
      VITARECOMP_ZIP: ${{ inputs.vitarecomp_zip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout repo alat (opsional)
        if: ${{ inputs.tool_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tool_repo }}
          ref: ${{ inputs.tool_ref }}
          path: toolrepo

      - name: Buka tools.zip dan vitarecomp.zip (opsional)
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          unpack() {   # $1 = file zip, $2 = folder tujuan
            local zip="$1" name="$2" tmp src
            if [ ! -f "$zip" ]; then
              echo "$zip tidak ada, dilewati."
              return 0
            fi
            tmp=$(mktemp -d)
            unzip -q -o "$zip" -d "$tmp"
            local entries=("$tmp"/*)
            # Kalau isi zip dibungkus satu folder, pakai isi folder itu
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$tmp"
            fi
            mkdir -p "$name"
            cp -a "$src"/. "$name"/
            # Kalau zip membungkus folder induk (mis. vitarecomp/vitarecomp), naikkan satu level
            if [ -d "$name/$name" ]; then
              cp -a "$name/$name"/. "$name"/
              rm -rf "$name/$name"
            fi
            echo "$zip -> $name/ ($(find "$name" -type f | wc -l) file)"
          }
          unpack "$TOOLS_ZIP" tools
          unpack "$VITARECOMP_ZIP" vitarecomp

      - name: Cek alat dan input
        run: |
          set -euo pipefail
          tool="$TOOL"
          if [ ! -f "$tool" ]; then
            mapfile -t found < <(find . -name usse_build_cache.py -not -path './work/*' | sort)
            if [ "${#found[@]}" -eq 1 ]; then
              tool="${found[0]#./}"
              echo "Alat ditemukan di: $tool"
            elif [ "${#found[@]}" -gt 1 ]; then
              echo "::error::Ada lebih dari satu usse_build_cache.py. Isi tool_script dengan salah satu:"
              printf '%s\n' "${found[@]}"
              exit 1
            else
              if [ -d toolrepo ]; then
                echo "Repo alat ($TOOL_REPO) berhasil di-clone, tapi isinya tidak punya usse_build_cache.py."
              else
                echo "tool_repo kosong, jadi hanya repo-mu yang dicari."
              fi
              echo "File yang namanya mirip (usse / build_cache / pack_shaders):"
              find . \( -iname '*usse*' -o -iname '*build_cache*' -o -iname '*pack_shaders*' \) -not -path './.git/*' -not -path './toolrepo/.git/*' | head -30
              echo "::error::usse_build_cache.py tidak ditemukan. Lihat daftar di atas. Kalau kosong, alatnya tidak ada di repo-mu maupun di tool_repo; tambahkan file itu (beserta folder vitarecomp/) ke repo-mu."
              exit 1
            fi
          fi
          echo "TOOL_PATH=$tool" >> "$GITHUB_ENV"
          if [ ! -e "$MISS_PATH" ]; then
            echo "::error::$MISS_PATH tidak ditemukan di repo. Commit folder miss (atau zip-nya) ke repo PRIVATE dulu."
            exit 1
          fi

      - name: Siapkan folder miss
        run: |
          set -euo pipefail
          shopt -s dotglob
          mkdir -p work/miss work/spv
          case "$MISS_PATH" in
            *.zip|*.ZIP) unzip -q -o "$MISS_PATH" -d work/miss ;;
            *) cp -a "$MISS_PATH"/. work/miss/ ;;
          esac
          # Kalau isi zip hanya satu folder pembungkus, naikkan satu level
          if [ "$(find work/miss -maxdepth 1 -type f | wc -l)" -eq 0 ] \
             && [ "$(find work/miss -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]; then
            inner=$(find work/miss -mindepth 1 -maxdepth 1 -type d)
            mv "$inner"/* work/miss/
            rmdir "$inner"
          fi
          # Alat memakai glob *.gxp tanpa rekursi, jadi pindahkan semua .gxp ke tingkat atas
          find work/miss -mindepth 2 -type f -iname '*.gxp' -exec mv -n {} work/miss/ \;
          echo "File di miss: $(find work/miss -type f | wc -l) (.gxp: $(find work/miss -maxdepth 1 -type f -name '*.gxp' | wc -l))"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Terjemahkan shader
        run: |
          set -euo pipefail
          root="$(dirname "$(dirname "$TOOL_PATH")")"
          pip install --quiet capstone numpy pillow
          if [ -f "$root/requirements.txt" ]; then pip install --quiet -r "$root/requirements.txt"; fi

          # Tambahkan ke PYTHONPATH semua folder yang berisi modul pendamping alat (usse_*.py)
          extra=""
          while IFS= read -r d; do
            extra="$extra:$PWD/${d#./}"
          done < <(find . -name 'usse_*.py' -not -path './.git/*' -not -path './work/*' -printf '%h\n' | sort -u)
          # ...dan folder induk dari paket vitarecomp (mis. di dalam toolrepo/)
          while IFS= read -r d; do
            extra="$extra:$PWD/${d#./}"
          done < <(find . -type d -name vitarecomp -not -path './.git/*' -not -path './work/*' -printf '%h\n' | sort -u)
          export PYTHONPATH="$PWD:$PWD/$root:$PWD/$(dirname "$TOOL_PATH")${extra}${PYTHONPATH:+:$PYTHONPATH}"

          # usse_coverage.programs() hanya dipanggil untuk capture mem_*.bin; untuk .gxp lepas alat tidak memakainya.
          # Kalau modulnya tidak ada, buat stub yang hanya error (dengan pesan jelas) kalau benar-benar dipanggil.
          if ! python -c "import usse_coverage" 2>/dev/null; then
            mkdir -p work/stubs
            cat > work/stubs/usse_coverage.py <<'STUB'
          def programs(src):
              raise RuntimeError("usse_coverage.py tidak ada di repo (stub): capture mem_*.bin tidak didukung, pakai .gxp saja")
          STUB
            export PYTHONPATH="$PWD/work/stubs:$PYTHONPATH"
            echo "::warning::usse_coverage.py tidak ditemukan; memakai stub (hanya .gxp yang didukung)."
          fi
          echo "PYTHONPATH=$PYTHONPATH"

          # Kalau modul yang diimpor alat tidak ada, tampilkan kepala file alat supaya jelas apa yang dicari
          if ! python - <<'PY'
          import importlib.util, sys
          missing = []
          for m in ("vitarecomp.usse.decode", "vitarecomp.usse.pbr", "vitarecomp.usse.translate"):
              try:
                  if importlib.util.find_spec(m) is None:
                      missing.append(m)
              except ImportError:
                  missing.append(m)
          if missing:
              print("Modul tidak ditemukan:", ", ".join(missing))
              sys.exit(1)
          PY
          then
            echo "--- 40 baris pertama $TOOL_PATH ---"
            sed -n 1,40p "$TOOL_PATH"
            echo "--- file usse_* dan folder vitarecomp yang ada di repo ---"
            find . \( -name 'usse_*' -o -name vitarecomp \) -not -path './.git/*' -not -path './work/*' | head -30
            echo "::error::Modul yang dibutuhkan alat tidak ada di repo. Salin seluruh folder tools/ dan vitarecomp/ dari sumber alat (bukan satu file saja), lalu jalankan lagi."
            exit 1
          fi

          # $EXTRA_ARGS sengaja tanpa kutip supaya terpecah jadi beberapa argumen
          python "$TOOL_PATH" work/spv work/miss $EXTRA_ARGS 2>&1 | tee work/build.log

      - name: Ringkasan
        run: |
          set -euo pipefail
          in_count=$(find work/miss -type f | wc -l)
          out_count=$(find work/spv -type f -name '*.spv' | wc -l)
          {
            echo "### Hasil terjemahan shader"
            echo ""
            echo "- Input (miss): $in_count file"
            echo "- Output .spv: $out_count file"
          } >> "$GITHUB_STEP_SUMMARY"

          # Bandingkan berdasarkan nama dasar (sebelum titik pertama)
          (cd work/miss && find . -type f -printf '%f\n' | sed 's/\..*$//' | sort -u) > work/in.txt
          (cd work/spv && find . -type f -name '*.spv' -printf '%f\n' | sed 's/\..*$//' | sort -u) > work/out.txt
          common=$(comm -12 work/in.txt work/out.txt | wc -l)
          if [ "$common" -gt 0 ]; then
            comm -23 work/in.txt work/out.txt > work/belum.txt
            echo "- Input yang belum punya .spv: $(wc -l < work/belum.txt) (daftar di artifact shader-log)" >> "$GITHUB_STEP_SUMMARY"
          else
            : > work/belum.txt
            echo "- Nama input dan output tidak cocok, perbandingan per file dilewati." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$out_count" -eq 0 ]; then
            echo "::error::Tidak ada file .spv yang dihasilkan. Lihat work/build.log di artifact shader-log."
            exit 1
          fi

      - name: Upload shader (.spv)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shader-spv
          path: work/spv/
          retention-days: 1

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-log
          path: |
            work/build.log
            work/belum.txt
          if-no-files-found: ignore
          retention-days: 3
